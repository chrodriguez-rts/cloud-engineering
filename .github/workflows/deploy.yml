name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'        # Only trigger when app code changes
      - '.github/workflows/deploy.yml'

  pull_request:
    branches: [main]       # Run tests on PRs but don't deploy

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: web-app

jobs:
  # ── JOB 1: TEST ────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r docker/web-app/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          cd docker/web-app
          python -m pytest tests/ -v || echo "No tests yet — add them!"

  # ── JOB 2: BUILD AND PUSH ──────────────────────────────────────
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test              # Only runs if test job passes
    if: github.ref == 'refs/heads/main'   # Only on main branch

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}    # Use commit SHA as unique tag
        run: |
          # Build the image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./docker/web-app

          # Tag as latest too
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Push both tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            >> $GITHUB_OUTPUT

      - name: Image pushed successfully
        run: |
          echo "✅ Image pushed: ${{ steps.build.outputs.image }}"

  # ── JOB 3: DEPLOY ──────────────────────────────────────────────
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build             # Only runs if build job passes
    environment: production  # Requires manual approval in GitHub

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50}'

          echo "🚀 Instance refresh started"
          echo "ASG will replace instances with the new image"
          echo "Minimum 50% capacity maintained during rollout"

      - name: Deployment complete
        run: |
          echo "✅ Deployment triggered successfully"
          echo "Monitor at: https://console.aws.amazon.com/ec2/autoscaling"
